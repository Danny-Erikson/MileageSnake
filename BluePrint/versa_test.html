<!doctype html>
<html>
  <head>
    <style>
      .base {
        padding: 10px;
        background-color: rgba(119, 136, 153, 0.5);
        border-radius: 15px;
        margin: 10px;
      }
      .general {
        padding: 10px;
        background-color: rgba(187, 119, 82, 0.5);
        border-radius: 15px;
        margin: 10px;
      }
      .flex-container {
        display: flex;
        justify-content: space-between;
        padding-bottom: 3px;
        font-size: 16px;
      }
      .flex-item {
        font-size: 24px;
        font-weight: bold;
      }
      .title {
        font-size: 24px;
        font-weight: bold;
      }
      .notes {
        font-size: 24px;
        font-weight: bold;
      }
      .smaller {
        padding: 2px 6px;
        font-size: 0.7em;
        font-style: italic;
        font-weight: initial;
      }
    </style>
  </head>
  <body>
    <div class="base">
      <h1>2017 Nissan Versa</h1>
      <div class="flex-container">
        <div class="flex-item">
          License Plate: <span class="smaller">5CFB246</span>
        </div>
        <div class="flex-item">
          VINNumber: <span class="smaller">1HGCM66563A018283</span>
        </div>
      </div>
    </div>
    <div class="base">
      <div class="title">Oil Change</div>
      <div class="flex-container">
        <div class="flex-item">
          Done At:<span class="smaller"> 119,297 miles</span>
        </div>
        <div class="flex-item">
          Done on:<span class="smaller"> 03-09-2026</span>
        </div>
      </div>
      <div>
        <div class="notes">
          Notes:<span class="smaller"
            >Oil used Kirkland High Mileage 5W-30</span
          >
        </div>
      </div>
    </div>
    <div class="general">
      <div class="title">Front Brakes</div>
      <div class="flex-container">
        <div class="flex-item">
          Done At: <span class="smaller">121,628 miles</span>
        </div>
        <div class="flex-item">
          Done on:<span class="smaller"> 04-17-2026</span>
        </div>
      </div>
      <div>
        <div class="notes">
          Notes:<span class="smaller"
            >Daralast gold used, warranty at AutoZone</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
